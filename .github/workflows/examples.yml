name: Examples

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIMBLE_FLAGS: "-y"

jobs:
  example:
    name: Build mix_ping example
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          # Matches the "current" Nim in ci.yml's matrix. ci.yml also covers
          # the 2.2.4 floor on full unit/component tests; for examples we
          # just smoke-build against the version most contributors run.
          nim-version: '2.2.10'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache nimble deps
        uses: actions/cache@v5
        with:
          # `make setup NIMBLE_FLAGS="$NIMBLE_FLAGS"` (below) provisions deps into the
          # project-local `nimbledeps/`, so cache both that and `~/.nimble`.
          path: |
            ~/.nimble
            nimbledeps
          key: nimble-examples-${{ hashFiles('libp2p_mix.nimble') }}

      - name: Install deps
        # Project-local install: provisions deps into `nimbledeps/` and
        # generates `nimble.paths`. We don't commit `nimble.lock` (see #13),
        # so `make setup NIMBLE_FLAGS="$NIMBLE_FLAGS"` is the right bootstrap.
        run: make setup NIMBLE_FLAGS="$NIMBLE_FLAGS"

      - name: Build mix_ping
        run: nimble example
