name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIMBLE_FLAGS: "-y"

jobs:
  test:
    # Each matrix job compiles one unit test binary + one component binary
    # (tests/test_all.nim, tests/component/test_all.nim) then runs them.
    # Previously each test_*.nim was its own entry point (~25-35 min). Keep 60
    # until the combined-binary times are measured in CI (#17).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Windows is intentionally not in the matrix yet:
          # `tests/test_cover_traffic` crashes inside the
          # `ConstantRateCoverTraffic cover_rate_fraction` suite on
          # Windows runners (abrupt process exit, no test-fail output).
          # Add Windows back once the underlying issue is fixed.
          - { os: linux, builder: ubuntu-22.04, cpu: amd64, cc: gcc }
          - { os: linux, builder: ubuntu-22.04, cpu: i386,  cc: gcc }
          - { os: macos, builder: macos-15,     cpu: arm64, cc: clang }
        nim:
          # libp2p v2.0.0 requires nim >= 2.2.4 transitively, so 2.0.16 is
          # no longer compatible. We test both the floor and current:
          # - 2.2.4 is the libp2p v2.0.0 minimum and the version this PR
          #   was validated against locally;
          # - 2.2.10 is the current 2.2.x and ships nimble 0.22.2, which
          #   is what most contributors will have on their host machines.
          - { ref: '2.2.4',  mm: refc }
          - { ref: '2.2.10', mm: refc }

    name: ${{ matrix.platform.os }}-${{ matrix.platform.cpu }} (Nim ${{ matrix.nim.ref }})
    runs-on: ${{ matrix.platform.builder }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Install i386 toolchain
        if: matrix.platform.cpu == 'i386'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y \
            gcc-multilib g++-multilib

      - name: Setup Nim ${{ matrix.nim.ref }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim.ref }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade Nimble on floor-Nim jobs
        # Nim 2.2.4 ships Nimble 0.18.2, whose resolver cannot reliably
        # select a single version from the current dependency graph.
        # Pin the commit behind Nimble 0.22.2 to avoid a registry/tag lookup.
        if: matrix.nim.ref == '2.2.4'
        run: |
          nimble install -y --useSystemNim \
            'https://github.com/nim-lang/nimble.git@#aa03f886e4a111d6af9090c6a1f1271d64b66f7b'
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
          "$HOME/.nimble/bin/nimble" --version

      - name: Set i386 build flags
        if: matrix.platform.cpu == 'i386'
        run: |
          echo "NIMFLAGS=${NIMFLAGS} --cpu:i386 --passC:-m32 --passL:-m32" >> $GITHUB_ENV
          echo "CC=gcc -m32" >> $GITHUB_ENV

      - name: Cache nimble deps
        id: nimble-cache
        uses: actions/cache@v5
        with:
          # `make setup NIMBLE_FLAGS="$NIMBLE_FLAGS"` (below) provisions deps into the
          # project-local `nimbledeps/`. Cache its reusable installation state and
          # Nimble's downloaded package repositories, but not registry/build state.
          path: |
            ~/.nimble/pkgcache
            nimbledeps/bin
            nimbledeps/pkgs2
            nimbledeps/nimbledata2.json
          key: nimble-${{ matrix.platform.os }}-${{ matrix.platform.cpu }}-${{ matrix.nim.ref }}-${{ hashFiles('libp2p_mix.nimble', '.github/workflows/ci.yml') }}

      - name: Install deps
        run: |
          nim --version
          nimble --version
          # Force the SAT solver to discover current tags. This index can be
          # stale even when the project-local dependency cache is clean.
          make clean-nimble-cache
          # Project-local install: provisions deps into `nimbledeps/` and
          # generates `nimble.paths`. We don't commit `nimble.lock` (see
          # #13), so `make setup NIMBLE_FLAGS="$NIMBLE_FLAGS"` is the right bootstrap
          # (vs `nimble install -dy`, which would expect a committed lock).
          make setup NIMBLE_FLAGS="$NIMBLE_FLAGS"

      - name: Run unit tests
        run: make test NIMBLE_FLAGS="$NIMBLE_FLAGS"

      - name: Run component tests
        run: make testComponent NIMBLE_FLAGS="$NIMBLE_FLAGS"
