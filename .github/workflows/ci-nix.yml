name: ci / nix

# Triggers conservatively to avoid taxing every code-only PR with a
# ~5-min nix install + build:
#
# - pull_request: only when nix-relevant files actually change.
# - push to master: post-merge smoke test (catches merge_group bypass).
# - schedule: weekly cron to catch external drift (nimble release,
#   nixpkgs bump, upstream rev moves) that no in-repo file change
#   would otherwise surface.
# - workflow_dispatch: manual trigger for ad-hoc validation (e.g.
#   after bumping the libp2p pin in libp2p_mix.nimble).
on:
  pull_request:
    paths:
      - 'libp2p_mix.nimble'
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'Makefile'
      - 'tools/gen-deps.sh'
      - '.github/workflows/ci-nix.yml'
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIMBLE_FLAGS: "-y"

jobs:
  nix-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # GitHub-hosted runners don't ship nix; install via the
      # DeterminateSystems action (faster cold install than the
      # cachix one). If self-hosted runners with nix preinstalled
      # become available for this repo, drop this step.
      # Pinned to tagged releases (not @main) for supply-chain safety.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Use Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      # `make refresh-deps` regenerates nix/deps.nix from libp2p_mix.nimble.
      # If the committed snapshot is stale (missing transitive deps,
      # outdated revs after a libp2p bump, etc.), the diff is non-empty
      # and we fail the job — surfaces drift on the PR that introduced
      # it rather than the next time someone runs `nix build` locally.
      - name: Regenerate nix/deps.nix and verify no drift
        run: |
          nix develop --command make refresh-deps NIMBLE_FLAGS="$NIMBLE_FLAGS"
          if ! git diff --exit-code nix/deps.nix; then
            echo "::error::nix/deps.nix is out of sync with libp2p_mix.nimble."
            echo "Run 'nix develop --command make refresh-deps NIMBLE_FLAGS=\"$NIMBLE_FLAGS\"' locally and commit the result."
            exit 1
          fi

      - name: nix build
        run: nix build -L

      - name: Show build outputs
        run: find result -type f | head -50

  # Failures on master (push) or the weekly cron have no PR author watching
  # them — GitHub only emails the actor who last touched this workflow file.
  # File (or bump) an issue instead so repo watchers get notified; closing
  # the issue re-arms creation.
  notify-failure:
    needs: nix-build
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create or update failure issue
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --label nix-ci-failure --state open \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --body "Still failing: $run_url (event: ${{ github.event_name }})"
          else
            gh label create nix-ci-failure \
              --description "ci / nix failing on master or cron" \
              --color d93f0b || true
            gh issue create \
              --title "ci / nix failing on master" \
              --label nix-ci-failure \
              --body-file - <<EOF
          The \`ci / nix\` job failed on \`${{ github.event_name }}\`: $run_url

          If the failure is the deps drift check, run \`nix develop --command make refresh-deps NIMBLE_FLAGS="-y"\` and commit the result.
          EOF
          fi
